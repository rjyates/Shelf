name: Shelf CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

concurrency:
  group: shelf-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.plan.outputs.server }}
      mobile: ${{ steps.plan.outputs.mobile }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      server_version: ${{ steps.plan.outputs.server_version }}
      mobile_version: ${{ steps.plan.outputs.mobile_version }}
      flutter_version: ${{ steps.plan.outputs.flutter_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate PR title and commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then unset PR_TITLE; fi
          python3 scripts/ci.py semantic
      - name: Test change detection and release policy
        run: python3 -m unittest discover -s tests -v
      - name: Select affected components
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 scripts/ci.py plan --pr
          else
            python3 scripts/ci.py plan
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: release-plan.json

  server:
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --manifest-path server/Cargo.toml --check
      - run: cargo clippy --manifest-path server/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path server/Cargo.toml --locked
      - run: node --check web/app.js
      - run: node --test tests/web.test.mjs
      - name: Build the release candidate image
        env:
          VERSION: ${{ needs.plan.outputs.server_version }}
        run: docker build -f deploy/Dockerfile --build-arg VERSION="$VERSION" -t "shelf-tested:$GITHUB_SHA" .
      - name: Verify Compose and container startup
        run: |
          docker compose config --quiet
          docker run -d --name shelf-smoke -p 127.0.0.1:8080:8080 "shelf-tested:$GITHUB_SHA"
          python3 scripts/smoke.py
          docker stop shelf-smoke
      - name: Export the tested image
        if: github.event_name == 'push'
        run: docker save "shelf-tested:$GITHUB_SHA" -o /tmp/shelf-image.tar
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: server-image
          path: /tmp/shelf-image.tar
          retention-days: 3

  mobile:
    needs: plan
    if: needs.plan.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.plan.outputs.flutter_version }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test

  android:
    needs: [plan, mobile]
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.plan.outputs.flutter_version }}
          cache: true
      - name: Build development-signed Android artifact
        working-directory: mobile
        env:
          VERSION: ${{ needs.plan.outputs.mobile_version }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: [plan, mobile]
    if: needs.plan.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.plan.outputs.flutter_version }}
          cache: true
      - name: Build unsigned iPhone artifact
        working-directory: mobile
        env:
          VERSION: ${{ needs.plan.outputs.mobile_version }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-codesign --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app ../shelf-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ios
          path: shelf-ios-unsigned.zip

  gate:
    name: ci-gate
    if: always()
    needs: [plan, server, mobile, android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Require success for every selected component
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs['plan']['result'] == 'success', 'Planning or semantic checks failed'
          selected = jobs['plan']['outputs']
          for name in ('server', 'mobile', 'android', 'ios'):
              if selected[name] == 'true':
                  assert jobs[name]['result'] == 'success', f'{name} did not pass'
          PY

  publish:
    needs: [plan, gate]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.plan.outputs.server == 'true' || needs.plan.outputs.mobile == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: cp artifacts/release-plan/release-plan.json release-plan.json
      - uses: docker/login-action@v3
        if: needs.plan.outputs.server == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish independently versioned releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py
