# Boots the Buildroot guest from distro/build.sh. No ISO download.
# Images: ../.build/oseink/images/{bzImage,rootfs.ext2}
services:
  qemu:
    build: .
    environment:
      DISK_DISABLE: "Y"
      DISK_TYPE: blk
      BOOT_MODE: legacy
      # Single-token -append: qemux word-splits ARGUMENTS (see entry.sh).
      ARGUMENTS: "-kernel /oseink/bzImage -append root=/dev/vda"
    devices:
      - /dev/kvm
    ports:
      - "8006:8006"
    volumes:
      - disks:/storage
      - ../.build/oseink/images/rootfs.ext2:/boot.img
      - ../.build/oseink/images/bzImage:/oseink/bzImage:ro
      # qemux exposes /shared as 9p mount_tag=shared; guest mounts it at /oseink.
      - ../distro/overlay:/shared
      # Shell damage frames (damage.json + frame.gray) for the viewer to poll.
      - ../distro/overlay/run:/usr/share/novnc/guest:ro
    stop_grace_period: 2m

volumes:
  disks:
