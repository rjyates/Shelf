name: shelf_mobile
description: "Shelf's shared Android and iPhone reading companion."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  archive: ^4.6.0
  connectivity_plus: ^7.3.2
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_readium: ^0.8.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/LICENSE
    - assets/fonts/InstrumentSerif-LICENSE.txt
    - assets/fonts/IBMPlexSans-LICENSE.txt
  fonts:
    - family: Instrument
      fonts:
        - asset: assets/fonts/serif.ttf
    - family: Plex
      fonts:
        - asset: assets/fonts/sans.ttf
