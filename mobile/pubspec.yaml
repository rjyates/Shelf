name: shelf_mobile
description: "Shelf's shared Android and iPhone reading companion."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/LICENSE
    - assets/fonts/InstrumentSerif-LICENSE.txt
    - assets/fonts/IBMPlexSans-LICENSE.txt
  fonts:
    - family: Instrument
      fonts:
        - asset: assets/fonts/serif.ttf
    - family: Plex
      fonts:
        - asset: assets/fonts/sans.ttf
