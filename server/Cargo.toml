[package]
name = "shelf-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
argon2 = "0.5"
epub = "2.1.5"
zip = { version = "3", default-features = false, features = ["deflate"] }
# CBR (RAR comic) → ZIP at ingest; write feature only for tests that build fixtures.
rars = { version = "0.12", default-features = false, features = ["write"] }
# DjVu → ZIP of page PNGs at ingest (MIT; avoid GPL `djvu` 0.1).
djvu-rs = { version = "0.44", default-features = false, features = ["cbz"] }
# CB7 (7z comic) → ZIP at ingest; compress feature builds test fixtures.
sevenz-rust2 = { version = "0.24", default-features = false, features = ["util", "compress"] }
axum = "0.8"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "fs", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tempfile = "3"
regex = "1"
xmltree = "0.11"
unicode-normalization = "0.1"
# Send-to-Kindle SMTP (M12 slice 8); rustls to match reqwest.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
