[package]
name = "shelf-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
argon2 = "0.5"
epub = "2.1.5"
zip = { version = "3", default-features = false, features = ["deflate"] }
# CBR (RAR comic) → ZIP at ingest; write feature only for tests that build fixtures.
rars = { version = "0.12", default-features = false, features = ["write"] }
# DjVu → ZIP of page PNGs at ingest (MIT; avoid GPL `djvu` 0.1).
djvu-rs = { version = "0.44", default-features = false, features = ["cbz"] }
axum = "0.8"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
